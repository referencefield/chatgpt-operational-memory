name: Operational-memory protocol validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Advisory structural validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install "PyYAML==6.0.2"

      - name: Validate protocol structure
        run: python tools/validate_protocol.py

# This workflow is intentionally advisory.
# PROTOCOL.yaml declares blocking_required_check: false, and the recommended
# main-branch ruleset does not require this status check. A failure should be
# investigated, but it does not prevent ordinary direct ChatGPT writes to main.