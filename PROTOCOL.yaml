protocol_version: "unreleased"
protocol_status: development
canonical_branch: main
front_door: START_HERE.md

template_source:
  repository_id: 1354330020
  repository: referencefield/chatgpt-operational-memory
  owner_name_runtime_resolved: true
  repository_name_part_of_protocol: false
  unresolved_repository_id_fails_closed: true
  manifest: PROTOCOL.yaml
  role: public_update_source_only
  check_on_request: true
  include_in_health_check_when_reachable: true
  auto_migrate: false

working_repository:
  identity: github_repository_id
  owner_name_runtime_resolved: true
  repository_name_part_of_protocol: false
  rename_supported: true
  rename_requires_internal_migration: false
  bootloader_uses_repository_id: true
  rename_requires_bootloader_refresh: false
  unresolved_repository_id_fails_closed: true

compatibility:
  primary_surface: chatgpt
  required_chatgpt_plugin: GitHub
  plugin_invocation: "@GitHub"
  plugin_requires_repository_read_write_actions: true
  separate_read_only_github_app_is_not_plugin_capability_authority: true
  readiness_is_capability_based_not_plan_name_based: true
  readiness_capability_test: reversible_crud_readback
  codex_bootloader: AGENTS.md
  chatgpt_work_uses_same_front_door: true
  other_models_require_equivalent_github_read_write_and_persistent_bootloader: true

activation:
  beginner_flow: create_connect_activate
  beginner_meaningful_decisions_before_ready_max: 3
  trigger_intents:
    - set up operational memory
    - retry setup
    - activate operational memory
    - initialize operational memory
    - wake up operational memory
    - start using operational memory
  requires_exact_repository: true
  resolve_repository_id: true
  require_private_working_copy: true
  reversible_crud_diagnostic: true
  diagnostic_file: SETUP-TEST.md
  create_durable_state_on_activation: false
  idempotent: true
  activation_receipt_required: true
  receipt_includes_repository_id: false
  bootloader_contains_repository_id: true
  user_need_not_understand_repository_id: true
  ready_label: "Operational memory: READY"
  blocked_label: "Operational memory: BLOCKED"
  blocked_reports_one_problem_one_action: true
  blocked_retry_command: "Retry setup."
  blocked_priority_order:
    - exact_repository_access
    - private_visibility
    - required_write_actions
    - write_readback_verification
    - diagnostic_cleanup
    - protocol_structure
  normal_setup_command: "@GitHub Set up operational memory from <repository URL>."
  configured_normal_entry: "@GitHub Use my operational memory."
  explicit_future_fallback: "@GitHub Use operational memory from <repository URL>."
  user_need_not_name_front_door_or_resolution_steps: true

human_docs:
  readme: README.md
  setup: SETUP.md
  example: EXAMPLE.md
  operations: OPERATIONS.md
  security: SECURITY.md
  migrations: MIGRATIONS.md
  evals: EVALS.md
  eval_results: EVAL_RESULTS.md
  contributing: CONTRIBUTING.md

global:
  current: CURRENT.md
  decisions: DECISIONS.md
  knowledge: KNOWLEDGE.md
  working_style: WORKING_STYLE.md
  projects: PROJECTS.md

projects:
  root: projects
  template: projects/_TEMPLATE
  front_door: PROJECT.md
  required_files:
    - PROJECT.md
    - CURRENT.md
    - DECISIONS.md
    - KNOWLEDGE.md

validation:
  mode: advisory
  script: tools/validate_protocol.py
  workflow: .github/workflows/protocol-validation.yml
  blocking_required_check: false

persistence:
  route_before_write: true
  prefer_existing_source_of_record: true
  unindexed_durable_files_allowed: false
  multi_file_changes_use_write_set: true
  verify_postcondition_after_write_set: true
  conservative_persistence_watch: true
  inferred_durable_intent_requires_confirmation: true
  sensitive_persistence_requires_confirmation: true

maintenance:
  canonical_branch_only_steady_state: true
  branch_cleanup_fail_closed: true
  commit_ancestry_alone_proves_incorporation: false
  verify_canonical_head_after_cleanup: true

soft_budgets:
  # Warning indicators only. Crossing one means inspect structure, not delete content.
  START_HERE.md_bytes: 10000
  CURRENT.md_bytes: 7000
  PROJECT.md_bytes: 9000
  project_CURRENT.md_bytes: 7000
  active_decisions_per_scope: 30
  active_knowledge_per_scope: 40
  active_working_style_entries: 20

lifecycle:
  knowledge_review_field: "Review after"
  working_style_review_field: "Review after"
  budget_status_when_crossed: Watch

custom_instruction_role: bootloader
custom_instruction_rule: >-
  Persistent ChatGPT instructions identify the working repository by its GitHub repository ID. Activation fills
  that ID into the bootloader for the user; the user is not required to understand or manually manage it. When
  durable context matters, ChatGPT resolves the ID to the repository's current owner/name, retrieves START_HERE.md,
  and follows the current protocol. Owner/name changes do not require a bootloader change; an unresolved ID fails
  closed rather than guessing a replacement.

release_rule: >-
  Keep protocol_version set to unreleased during pre-release development. Assign the first real release
  identifier only when the release candidate is frozen; thereafter record upgrades in MIGRATIONS.md.
